<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACID Monitoring</title>
<style>
:root{--bg:#0B0E14;--surface:#141926;--border:#273143;--tx:#E8ECF4;--tx2:#9AA4B8;--ac:#6E8EF2;--ok:#3ECF8E;--warn:#E5B567;--err:#E5726F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Helvetica Neue",sans-serif;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
h1{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px}
.card h3{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.card .value{font-size:24px;font-family:"JetBrains Mono",monospace}
.card .value.ok{color:var(--ok)}
.card .value.warn{color:var(--warn)}
.card .value.err{color:var(--err)}
.status-list{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px}
.status-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.status-item:last-child{border-bottom:none}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.status-dot.ok{background:var(--ok)}
.status-dot.warn{background:var(--warn)}
.status-dot.err{background:var(--err)}
.btn{background:var(--ac);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-secondary{background:var(--surface);color:var(--tx2);border:1px solid var(--border)}
</style>
</head>
<body>

<div class="header">
<h1>ACID Monitoring</h1>
<div>
<button class="btn" onclick="refresh()">Refresh</button>
<button class="btn btn-secondary" onclick="location.href='/'">Back to ACID</button>
</div>
</div>

<div class="grid">
<div class="card"><h3>System Status</h3><div class="value ok" id="sysStatus">ONLINE</div></div>
<div class="card"><h3>Total Solves</h3><div class="value" id="totalSolves">0</div></div>
<div class="card"><h3>Success Rate</h3><div class="value ok" id="successRate">0%</div></div>
<div class="card"><h3>KB Size</h3><div class="value" id="kbSize">0</div></div>
</div>

<h2 style="font-size:16px;margin-bottom:12px">Component Status</h2>
<div class="status-list" id="components">
<div class="status-item"><span><span class="status-dot ok"></span>Substrate</span><span>ONLINE</span></div>
<div class="status-item"><span><span class="status-dot ok"></span>Discovery</span><span>ONLINE</span></div>
<div class="status-item"><span><span class="status-dot ok"></span>Verification</span><span>ONLINE</span></div>
<div class="status-item"><span><span class="status-dot ok"></span>Knowledge</span><span>ONLINE</span></div>
<div class="status-item"><span><span class="status-dot ok"></span>Transfer</span><span>ONLINE</span></div>
<div class="status-item"><span><span class="status-dot ok"></span>Feedback</span><span>ONLINE</span></div>
</div>

<script>
async function refresh() {
  try {
    var resp = await fetch('/api/status');
    var data = await resp.json();
    document.getElementById('sysStatus').textContent = data.system.toUpperCase();
    document.getElementById('totalSolves').textContent = data.solves || 0;
    document.getElementById('successRate').textContent = data.success_rate || '0%';
    document.getElementById('kbSize').textContent = data.kb_size || 0;
  } catch(e) {
    document.getElementById('sysStatus').textContent = 'OFFLINE';
    document.getElementById('sysStatus').className = 'value err';
  }
}

refresh();
setInterval(refresh, 10000);
</script>

</body>
</html>
