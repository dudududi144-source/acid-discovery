<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACID</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0E14;color:#E8ECF4;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.container{max-width:600px;width:100%;padding:20px}
h1{font-size:24px;margin-bottom:8px}
.sub{color:#9AA4B8;font-size:13px;margin-bottom:24px}
.input-area{background:#141926;border:1px solid #273143;border-radius:8px;padding:16px;margin-bottom:16px}
textarea{width:100%;background:transparent;border:none;color:#E8ECF4;font-family:monospace;font-size:13px;resize:vertical;min-height:60px;outline:none}
.btn{background:#6E8EF2;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{opacity:.9}
.result{background:#141926;border:1px solid #273143;border-radius:8px;padding:16px;margin-top:16px;display:none}
.result.show{display:block}
.result pre{font-family:monospace;font-size:12px;white-space:pre-wrap;color:#9AA4B8}
.status{font-size:11px;color:#5C6778;margin-top:16px}
</style>
</head>
<body>
<div class="container">
<h1>ACID</h1>
<p class="sub">Autonomous Computational Intelligence Discovery</p>
<div class="input-area">
<textarea id="problem" placeholder="Describe what to compute... e.g. Sum of [1,2,3] = [6]"></textarea>
</div>
<button class="btn" onclick="solve()">Solve</button>
<div class="result" id="result">
<pre id="output"></pre>
</div>
<p class="status" id="status">Ready</p>
</div>
<script>
var API = "https://acid-api.rabotatony.workers.dev";

async function solve() {
  var problem = document.getElementById("problem").value;
  if (!problem) return;
  
  document.getElementById("status").textContent = "Solving...";
  document.getElementById("result").className = "result";
  
  // Parse the problem
  var inputs = [1, 2, 3];
  var expected = [6];
  
  // Try to parse inputs from the problem text
  var match = problem.match(/\[([\d,\s]+)\]/g);
  if (match && match.length >= 1) {
    inputs = match[0].replace(/[\[\]]/g, "").split(",").map(Number);
  }
  if (match && match.length >= 2) {
    expected = match[1].replace(/[\[\]]/g, "").split(",").map(Number);
  }
  
  try {
    var resp = await fetch(API + "/api/solve", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({inputs: inputs, expected: expected})
    });
    var data = await resp.json();
    
    document.getElementById("result").className = "result show";
    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    document.getElementById("status").textContent = "Status: " + (data.status || "unknown");
  } catch(e) {
    document.getElementById("result").className = "result show";
    document.getElementById("output").textContent = "Error: " + e.message;
    document.getElementById("status").textContent = "Error";
  }
}

// Check API status on load
async function checkStatus() {
  try {
    var resp = await fetch(API + "/api/status");
    var data = await resp.json();
    document.getElementById("status").textContent = "API: " + data.system + " | Solves: " + data.solves;
  } catch(e) {
    document.getElementById("status").textContent = "API: offline";
  }
}
checkStatus();
</script>
</body>
</html>
